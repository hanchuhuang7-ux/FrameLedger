<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FrameLedger · 渲染帧检查器</title>
<style>
:root {
  color-scheme: light;
  --ink: #183b33;
  --muted: #506961;
  --line: #ced9d0;
  --paper: #f6f7f1;
  --panel: #fffefa;
  --ready: #276d59;
  --miss: #a35730;
  --empty: #886700;
  --damage: #a33745;
  --mono: "IBM Plex Mono",Consolas,monospace;
  font: 16px/1.5 Inter,"Microsoft YaHei",sans-serif;
  color: var(--ink);
  background: var(--paper);
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
header,main,footer {
  width: min(1090px,calc(100% - 48px));
  margin: auto;
}
header {
  height: 78px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 13px;
}
header strong {
  font: 700 21px/1 Inter,Arial,sans-serif;
  letter-spacing: -.8px;
}
header small {
  color: var(--muted);
}
.mark {
  display: flex;
  gap: 3px;
  align-items: center;
  padding: 6px;
  width: 32px;
  height: 28px;
  background: var(--ink);
  border-radius: 5px;
}
.mark i {
  display: block;
  background: #e8f1da;
  height: 7px;
  width: 5px;
}
.mark i:nth-child(2) {
  height: 16px;
}
.mark i:nth-child(3) {
  height: 11px;
}
main {
  padding: 37px 0 34px;
}
h1,h2,p {
  margin: 0;
}
h1 {
  font-size: clamp(30px,4vw,43px);
  font-weight: 650;
  letter-spacing: -.06em;
  line-height: 1.2;
}
h2 {
  font-size: 17px;
  font-weight: 650;
  letter-spacing: -.025em;
}
.intro {
  color: var(--muted);
  margin: 9px 0 27px;
}
.layout {
  display: grid;
  grid-template-columns: minmax(272px,.82fr) minmax(0,1.6fr);
  gap: 16px;
  align-items: start;
}
.panel {
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--panel);
  padding: 24px;
}
.panel>h2 {
  margin-bottom: 18px;
}
fieldset {
  border: 0;
  margin: 0;
  padding: 0;
}
label {
  display: block;
  font-size: 13px;
  font-weight: 650;
}
button,input,textarea {
  font: inherit;
}
button {
  cursor: pointer;
  min-height: 42px;
  border: 1px solid var(--line);
  border-radius: 7px;
  color: var(--ink);
  background: var(--panel);
  padding: 8px 13px;
  line-height: 1.4;
  font-size: 14px;
  font-weight: 600;
}
button:hover {
  border-color: var(--ready);
}
button:focus-visible,input:focus-visible,textarea:focus-visible {
  outline: 3px solid #d29a4a;
  outline-offset: 2px;
}
button:disabled {
  opacity: .55;
  cursor: default;
}
.primary {
  width: 100%;
  background: var(--ink);
  color: white;
  border-color: var(--ink);
  margin-top: 16px;
}
.primary:hover {
  background: var(--ready);
}
.files {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.link {
  border: 0;
  background: none;
  padding-left: 1px;
  padding-right: 1px;
  text-decoration: underline;
  text-underline-offset: 3px;
  color: var(--muted);
}
.source {
  color: var(--muted);
  font-size: 12px;
  overflow-wrap: anywhere;
}
.form-section {
  margin-top: 19px;
}
input[type=text],input[type=number],textarea {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--ink);
  background: #fff;
  padding: 8px 9px;
  min-height: 40px;
  margin-top: 6px;
  font: 14px var(--mono);
}
.numbers {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 8px;
  margin: 14px 0 18px;
}
.check {
  display: flex;
  align-items: center;
  gap: 7px;
}
.check input {
  accent-color: var(--ready);
  width: 16px;
  height: 16px;
  margin: 0;
}
.hint,.status {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.6;
}
.hint {
  margin-top: 5px;
}
.status {
  margin-top: 9px;
  min-height: 18px;
}
.status[data-error="true"] {
  color: var(--damage);
}
.summary {
  display: flex;
  align-items: start;
  justify-content: space-between;
  gap: 10px;
}
.total {
  font: 600 clamp(43px,6vw,70px)/1 var(--mono);
  letter-spacing: -.09em;
  margin: 9px 0 5px;
}
.total small {
  font: 400 .4em var(--mono);
  letter-spacing: -.06em;
  color: var(--muted);
}
.scope {
  color: var(--muted);
  font-size: 13px;
  overflow-wrap: anywhere;
}
.map {
  display: flex;
  gap: 3px;
  min-height: 17px;
  margin: 22px 0 21px;
}
.bin {
  flex: 1;
  min-width: 0;
  border-radius: 2px;
  background: var(--ready);
}
.bin.missing {
  background: repeating-linear-gradient(-45deg,#f4d8c4 0 3px,#ac6945 3px 5px);
}
.bin.empty {
  background: #e4bd5c;
}
.bin.damaged {
  background: #b75569;
}
.bin.unverified, .review-color {
  background: #7165a5;
}
.bin.mixed {
  background: repeating-linear-gradient(90deg,#7b9186 0 3px,#b18c70 3px 6px);
}
.result-list {
  margin: 0;
}
.result-list div {
  display: grid;
  grid-template-columns: 90px minmax(0,1fr) 60px;
  align-items: baseline;
  border-top: 1px solid var(--line);
  padding: 9px 0;
  gap: 10px;
  font-size: 14px;
}
.result-list dt {
  display: flex;
  align-items: center;
  gap: 7px;
}
.result-list dd {
  margin: 0;
}
.result-list dd:last-child {
  text-align: right;
  color: var(--muted);
  font-size: 12px;
}
.swatch {
  width: 9px;
  height: 9px;
  border-radius: 2px;
  background: var(--miss);
}
.empty-color {
  background: #cc9f2a;
}
.damaged-color {
  background: var(--damage);
}
.range {
  font: 14px/1.6 var(--mono);
  overflow-wrap: anywhere;
  max-height: 9rem;
  overflow: auto;
}
.repair {
  margin: 15px 0 0;
  padding: 14px 16px;
  background: #e8f0e9;
  border-radius: 8px;
}
.repair h2 {
  font-size: 13px;
  margin-bottom: 5px;
}
.repair .range {
  font-size: 20px;
  line-height: 1.4;
  font-weight: 650;
}
.details {
  color: var(--muted);
  font-size: 13px;
  margin-top: 14px;
}
.details summary {
  cursor: pointer;
}
.details ul {
  padding-left: 20px;
  max-height: 12rem;
  overflow: auto;
  overflow-wrap: anywhere;
}
.export {
  margin-top: 15px;
}
.summary button,.export {
  font-size: 13px;
}
.bottom {
  border-top: 1px solid var(--line);
  padding: 14px 0 24px;
  font-size: 12px;
  color: var(--muted);
}
[hidden] {
  display: none!important;
}
@media(max-width:730px) {
  header,main,footer {
    width: calc(100% - 28px);
  }
  header {
    height: 59px;
  }
  main {
    padding-top: 22px;
  }
  .intro {
    font-size: 14px;
    margin-bottom: 18px;
  }
  .layout {
    grid-template-columns: 1fr;
  }
  .panel {
    padding: 18px;
  }
  .result-list div {
    grid-template-columns: 79px minmax(0,1fr) 45px;
    gap: 5px;
  }
  .map {
    gap: 2px;
  }
}
</style>
</head>
<body>
<header><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span><strong>FrameLedger</strong><small>本地版 · {{VERSION}}</small></header>
<main>
<h1>渲染帧检查器</h1>
<p class="intro">检查动画序列的缺帧、空文件及 PNG、EXR 结构，生成补渲染清单。</p>
<div class="layout">
<section class="panel" aria-labelledby="input-title">
<h2 id="input-title">检查哪组帧</h2>
<form id="settings">
<fieldset id="controls">
<div class="files"><button type="button" id="choose">选择文件夹</button><button class="link" type="button" id="use-demo">PNG 示例</button><button class="link" type="button" id="exr-demo">EXR 示例</button></div>
<input id="folder" type="file" webkitdirectory multiple hidden>
<p id="source" class="source"></p>
<button class="link" type="button" id="add-overlay">添加补帧目录</button>
<input id="overlay-folder" type="file" webkitdirectory multiple hidden>
<button class="link" type="button" id="import-job">导入镜头设置</button>
<input id="job-file" type="file" accept=".json,application/json" hidden>
<div class="form-section"><label for="pattern">命名模板</label><input id="pattern" type="text" value="shot_####.png" required spellcheck="false"><p class="hint">用 # 表示帧号位数。例如 shot_####.png 匹配 shot_0001.png。</p></div>
<div class="numbers"><label>起始帧<input id="first" type="number" value="1" min="-1000000000" max="1000000000" required></label><label>结束帧<input id="last" type="number" value="8" min="-1000000000" max="1000000000" required></label><label>步长<input id="step" type="number" value="1" min="1" max="1000000000" required></label></div>
<label class="check"><input id="check-png" type="checkbox" checked>检查 PNG 和 EXR 文件结构</label>
<label class="form-section" for="size">预期图像尺寸（可选）</label><input id="size" type="text" placeholder="例如 1920x1080" spellcheck="false">
<p class="hint">PNG 核对 CRC。EXR 核对扫描线区块，深度和分块格式单列待复核。</p>
<details class="details"><summary>EXR 必需通道（可选）</summary>
<label for="exr-channels">每行一个完整通道名</label><textarea id="exr-channels" rows="3" placeholder="ViewLayer.Depth.Z" spellcheck="false"></textarea></details>
<button class="primary" type="submit">检查帧序列</button>
</fieldset></form>
<p class="status" id="status" role="status" aria-live="polite"></p>
</section>
<section class="panel" id="results" aria-labelledby="result-title">
<div class="summary"><div><h2 id="result-title">可用帧</h2><p class="total"><span id="ready">—</span> <small>/ <span id="expected">—</span></small></p></div><button type="button" id="export" disabled>导出 JSON</button></div>
<p id="scope" class="scope"></p><div class="map" id="frame-map" aria-hidden="true"></div>
<dl class="result-list">
<div><dt><i class="swatch"></i>缺帧</dt><dd class="range" id="missing">—</dd><dd id="missing-count"></dd></div>
<div><dt><i class="swatch empty-color"></i>空文件</dt><dd class="range" id="empty">—</dd><dd id="empty-count"></dd></div>
<div><dt><i class="swatch damaged-color"></i>文件异常</dt><dd class="range" id="damaged">—</dd><dd id="damaged-count"></dd></div>
<div id="review-row" hidden><dt><i class="swatch review-color"></i>待复核</dt><dd class="range" id="unverified">—</dd><dd id="unverified-count"></dd></div>
</dl>
<div class="repair"><h2>需要补渲染的帧号</h2><div class="range" id="rerender">—</div></div>
<details id="details" class="details" hidden><summary>查看文件诊断</summary><ul id="issues"></ul></details>
</section></div>
</main>
<footer class="bottom">所选文件仅在当前浏览器内读取。检查范围为所选目录的第一层。</footer>
<script id="demo-data" type="application/json">{{DEMO}}</script>
<script type="module">
import * as engine from "{{ENGINE}}";
import { scanSequence, formatSpans, parseSize, readJob } from "{{SHARED}}";
{{PAGE_JS}}
</script>
<!-- {{NOTICE}} -->
</body>
</html>
